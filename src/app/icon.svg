<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Squircle Background -->
  <rect width="100" height="100" rx="22" fill="#161618" />
  
  <defs>
    <!-- Sharp 4-pointed star (Apple Intelligence style) -->
    <!-- Extends from 36 to 64 (width/height 28) -->
    <path id="star" d="M 50 36 C 50 49 51 50 64 50 C 51 50 50 51 50 64 C 50 51 49 50 36 50 C 49 50 50 49 50 36 Z" />
  </defs>
  
  <!-- 6 Stars in a Ring -->
  <!-- We rotate from the center (50,50) and translate upwards to form the circle -->
  <!-- Increased the translation and star size to make them very prevalent -->
  <use href="#star" fill="#E07A9E" transform="rotate(0 50 50) translate(0 -25)" />
  <use href="#star" fill="#E2D2A5" transform="rotate(60 50 50) translate(0 -25)" />
  <use href="#star" fill="#C89943" transform="rotate(120 50 50) translate(0 -25)" />
  <use href="#star" fill="#D6CA60" transform="rotate(180 50 50) translate(0 -25)" />
  <use href="#star" fill="#D5A7B8" transform="rotate(240 50 50) translate(0 -25)" />
  <use href="#star" fill="#C54E7E" transform="rotate(300 50 50) translate(0 -25)" />
</svg>
